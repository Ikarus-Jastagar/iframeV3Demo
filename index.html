<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVC</title>
    <link rel="stylesheet" href="style.css">
    <!-- //TempCommit -->
</head>
<body>
    <div class="mainWrapperClass">
        <img class="placerImages" src="assets/DVC1.png" alt="upper image"/>
        <div class="parentContainer">
            <a href="https://www.ikarusdelta.com" target="_blank" class="ikarusDeltaLogoParent">
                <img src="assets/IkarusDelta.svg" alt="Ikarus Delta logo" class="ikarusDeltaLogo">
            </a>
            <div class="leftSection">
                <iframe id="myIframe" src="https://viewer.ikarusdelta.com/product?id=356b8308-39d2-4766-88f2-e4c76870e6c9"></iframe>
                <div id="modelsButtonContainerDiv"></div>
                <div class="bottomSection">
                    <div id="bottom_material_selection_pannel"></div>
                </div>
            </div>
    
            <div class="rightSection">
                <div id="productDetails">
                    <div class="product-name">
                        Contexture Fabric
                    </div>
                </div>
                <div id="CategoryActiveButtons"></div>
                <div id="buttons-Container">
                    <div id="primeCatsOptions"></div>
                </div>
            </div>
        </div>
        <img class="placerImages" src="assets/DVC2.png" alt="bottom image"/>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
